#Development version of proporties configuration 
server:
   port: 8083

#database connection properties
spring:
   datasource:
      url: jdbc:mysql://localhost:3306/auth_app_yt?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      username: root
      password: ssssssssss       # 👈 change this
      driver-class-name: com.mysql.cj.jdbc.Driver

   jpa:
      hibernate:
         ddl-auto: update
      properties:
         hibernate:
           dialect: org.hibernate.dialect.MySQLDialect
           format_sql: true
      show-sql: true
         
logging:
   level:
      org.springframework.security: DEBUG

security:
   jwt:
   secret: ${JWT_SECRET:secret}
   issuer: ${JWT_ISSUER:api.substrings.com}
   access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
   refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}
   refresh-token-cookie-name: ${JWT_REFRESH_TOKEN_COOKIE_NAME:refreshToken}
   coockie-secure: ${JWT_COOKIE_SECURE:true}
   cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}
   cookie-same-site: ${JWT_COOKIE_SAME_SITE:lax}
      
